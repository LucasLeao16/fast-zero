[project]
name = "fast-zero"
version = "0.1.0"
description = ""
authors = [{ name = "LucasLeao16", email = "lucas99br@gmail.com" }]
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "pydantic[email]>=2.14.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "pydantic-settings>=2.16.3",
    "alembic>=1.20.1",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.4.2",
    "python-multipart>=0.0.34",
    "psycopg[binary]>=3.3.9",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.163.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "taskipy>=1.14.1",
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "testcontainers>=4.15.0",
    "pytest-asyncio>=1.5.0",
]

[tool.uv]
# Aplicação, não biblioteca: o uv só instala as dependências
package = false

# Faz o Pylance/Pyright (VS Code) usarem o ambiente criado pelo uv,
# mesmo que outro interpretador esteja selecionado no editor.
[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'double'

[tool.taskipy.tasks]
lint = 'ruff check . && ruff check . --diff'
format = 'ruff check . --fix && ruff format .'
run = 'fastapi dev fast_zero/app.py'
pre_test = 'task lint'
test = 'pytest -x --cov=fast_zero -vv'
post_test = 'coverage html'
