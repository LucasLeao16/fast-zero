[project]
name = "fast-zero"
version = "0.1.0"
description = ""
authors = [{ name = "LucasLeao16", email = "lucas99br@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi[standard]>=0.114.1,<0.115",
    "pydantic[email]>=2.8.2,<3",
    "sqlalchemy>=2.0.32,<3",
    "pydantic-settings>=2.4.0,<3",
    "alembic>=1.13.2,<2",
    "pyjwt>=2.9.0,<3",
    "pwdlib[argon2]>=0.2.1,<0.3",
    "python-multipart>=0.0.9,<0.0.10",
    "psycopg[binary]>=3.2.1,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0,<0.7",
    "pytest>=8.3.2,<9",
    "pytest-cov>=5.0.0,<6",
    "taskipy>=1.13.0,<2",
    "factory-boy>=3.3.1,<4",
    "freezegun>=1.5.1,<2",
    "testcontainers>=4.8.1,<5",
]

[tool.uv]
# Aplicação, não biblioteca: o uv só instala as dependências
package = false

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'double'

[tool.taskipy.tasks]
lint = 'ruff check . && ruff check . --diff'
format = 'ruff check . --fix && ruff format .'
run = 'fastapi dev fast_zero/app.py'
pre_test = 'task lint'
test = 'pytest -x --cov=fast_zero -vv'
post_test = 'coverage html'
