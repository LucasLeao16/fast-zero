services:
  fastzero_database:
    image: postgres:18
    env_file: .env
    volumes:
      # A partir do Postgres 18 o volume é montado em /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  fastzero_app:
    image: fastzero_app
    build: .
    env_file: .env
    environment:
      # Dentro da rede do compose o host do banco é o nome do serviço
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@fastzero_database:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      fastzero_database:
        condition: service_healthy

volumes:
  pgdata:
